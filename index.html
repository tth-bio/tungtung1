    <script>
        // ============================================================
        //  ССЫЛКА НА RAW-ФАЙЛ ВАШЕГО ТУЛА (обновлена)
        // ============================================================
        const RAW_FILE_URL = 'https://raw.githubusercontent.com/tth-bio/tungtung1/refs/heads/website/tungtunghookv1.py';

        document.addEventListener('DOMContentLoaded', function() {
            const downloadBtn = document.getElementById('download-btn');

            if (downloadBtn) {
                downloadBtn.addEventListener('click', function(e) {
                    e.preventDefault();

                    fetch(RAW_FILE_URL)
                        .then(response => {
                            if (!response.ok) {
                                throw new Error('Не удалось загрузить файл: ' + response.status);
                            }
                            return response.text();
                        })
                        .then(content => {
                            const blob = new Blob([content], { type: 'text/x-python' });
                            const url = window.URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = 'tungtunghookv1.py';
                            document.body.appendChild(a);
                            a.click();
                            document.body.removeChild(a);
                            window.URL.revokeObjectURL(url);
                        })
                        .catch(error => {
                            alert('Ошибка загрузки файла: ' + error.message);
                            console.error(error);
                        });
                });
            }
        });
    </script>
